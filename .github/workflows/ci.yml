name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.11 --extra video --extra ml --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (CPU, no data)
        run: uv run pytest -m "not gpu and not data"
      - name: README has no unsourced result numbers
        run: uv run python scripts/check_readme_numbers.py
