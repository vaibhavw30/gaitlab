# Benchmark protocol (EVALUATION.md §4)
warmup_iters: 20
measure_iters: 200
batch_sizes: [1, 16]
precision: bf16                    # bf16 | fp16. Gemma 3 overflows fp16: NaN grades (ADR-0015)
clip: data/raw/BENCH/natural.mp4   # fixed 60-s clip; set per machine
stages: [decode, pose, clean_events_features, scoring_pass, generate]
trt:
  ir: dynamo
  optimization_level: 3
  parity_required: 1.0             # fraction of test prompts with identical argmax grade
  torch_executed_ops: []           # "aten.<op>.<overload>" left to PyTorch; [] = whole wrapper in TensorRT
